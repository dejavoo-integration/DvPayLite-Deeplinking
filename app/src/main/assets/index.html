<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment App Trigger</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        input {
            padding: 10px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 10px;
            margin-top: 10px;
        }
        button {
            background-color: #e3e3e6;
            text-align: center;
            margin: 5px;
            padding: 10px 15px;
            font-size: 12px;
        }
        .dropdown-container {
            display: flex;
            gap: 10px;
        }
        select {
            padding: 10px;
            font-size: 10px;
            text-align: center;
            margin-bottom: 10px;
            margin-top: 10px;
        }
        approval-div {
           display: flex;
           flex-direction: column;
           gap: 10px;
        }
        .tax-input {
            width: 68px;
            max-width: 20vw;
            padding: 6px 4px;
            font-size: 11px;
            margin-bottom: 6px;
            margin-top: 6px;
        }
    </style>
</head>

<body>

<h3>Make a Payment</h3>

<input type="number" id="tpnTextInput" placeholder="Enter TPN"/>

<div>
    <button id="registerButton" onclick="handleRegisterClick()">Register</button>
    <button id="getTPNButton" onclick="getTPNClick()">Get TPN</button>
    <button id="getDeviceutton" onclick="getDeviceClick()">Get Device</button>
</div>

<input type="number" id="amountTextInput" placeholder="Enter Amount"/>
<input type="number" id="tipInput" placeholder="Enter Tip"/>
<input type="text" id="refIdtextInput" placeholder="Enter Ref Id if Tip Adjust/Ticket"/>
<input type="text" id="merchantIdTextInput" placeholder="Enter MerchantId"/>
<input type="text" id="primaryColortextInput" placeholder="Enter Primary color"/>
<input type="text" id="secondaryColortextInput" placeholder="Enter Secondary color"/>
<input type="text" id="negativeColortextInput" placeholder="Enter Negative Color"/>
<input type="text" id="fonttextInput" placeholder="Enter font"/>



<div class="dropdown-container">
    <h3>AVS</h3>
    <select id="optionAvs" onchange="handleAvsChange()">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
    </select>
</div>

<div class="dropdown-container">
    <h3>Remove Logo</h3>
    <select id="optionLoader" onchange="handleLoaderChange()">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
    </select>
</div>

<input type="text" id="phoneNumberInput" placeholder="Enter Phone Number"/>
<input type="email" id="emailInput" placeholder="Enter Email"/>

<div class="dropdown-container">
    <input type="number" class="tax-input" id="cityTaxInput" placeholder="CityTax"/>
    <input type="number" class="tax-input" id="stateTaxInput" placeholder="StateTax"/>
    <input type="number" class="tax-input" id="reduceTaxInput" placeholder="ReduceTax"/>
</div>

<div class="dropdown-container">
    <select id="optionDropdown" onchange="handleDropdownChange()">
        <option value="SALE">SALE</option>
        <option value="REFUND">REFUND</option>
        <option value="VOID">VOID</option>
        <option value="TIP ADJUST">TIP ADJUST</option>
        <option value="PRE_AUTH">PRE_AUTH</option>
        <option value="INC_AUTH">INC_AUTH</option>
        <option value="TICKET">TICKET</option>
        <option value="SETTLE">SETTLE</option>
        <option value="BALANCE">BALANCE</option>
        <option value="ADMINISTRATIVE_TXN">ADMINISTRATIVE_TXN</option>
    </select>

    <select id="optionPaymentType" onchange="paymentTypeDropdownChange()">
        <option value="CREDIT">CREDIT</option>
        <option value="DEBIT">DEBIT</option>
        <option value="EBT_FOOD">EBT_FOOD</option>
        <option value="EBT_CASH">EBT_CASH</option>
        <option value="GIFT">GIFT</option>
        <option value="LOYALTY">LOYALTY</option>
    </select>

    <select id="optionReceiptType" onchange="receiptDropdownChange()">
        <option value="No">No</option>
        <option value="Both">Both</option>
        <option value="Merchant">Merchant</option>
        <option value="Customer">Customer</option>
        <option value="">Empty(For Testing)</option>
    </select>
</div>

<approval-div>
    <label for="ApprovalScreenType"><small>Is Approval screen required?</small></label>
    <div class="dropdown-container">
        <select id="ApprovalScreenType" onchange="approvalDropdownChange()">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
            <option value="No Tag(For Testing)">No Tag(For Testing)</option>
            <option value="">Empty(For Testing)</option>
        </select>

        <input type="number" id="isvIdTextInput" placeholder="Enter IsvId"
               oninput="this.value = this.value.slice(0, 12)" />
    </div>
</approval-div>

<div class="dropdown-container">
    <button id="payButton" onclick="handleClick()">Make transaction</button>
    <button id="statusButton" onclick="handleStatusCheck()">Check txn Status</button>
</div>

<div id="urlDisplayResponse"></div>

</body>

<script type="text/javascript">

    let receivedUrl = "";
    let response = "";
    let selectedOption = "";
    let receiptSelected = "";
    let paymentTypeSelected = "";
    let approvalSelected = "";
    let selectedAvsOption = "";
    let selectedLoaderOption = "";

    function receiveUrl(url) {
        console.log("Received URL: " + url);
        receivedUrl = url;
        window.location.href = url;
    }

    function handleClick() {
        const type = selectedOption || 'SALE';
        const paymentType = paymentTypeSelected || 'CREDIT';
        const avs = selectedAvsOption || 'YES';
        const removeLoader = selectedLoaderOption || 'YES';
        const receiptType = receiptSelected === "Empty(For Testing)" ? "" : receiptSelected || 'No';

        const tpn = document.getElementById("tpnTextInput").value;
        const amount = document.getElementById("amountTextInput").value;
        const tipInput = document.getElementById("tipInput").value;
        const refId = document.getElementById("refIdtextInput").value;
        const hostType = selectedOption === "SETTLE" ? 'settle' : 'pay';
        const isvID = document.getElementById("isvIdTextInput").value;
        const merchantId = document.getElementById("merchantIdTextInput").value;

        const primaryColor = document.getElementById("primaryColortextInput").value;
        const secondaryColor = document.getElementById("secondaryColortextInput").value;
        const negativeColor = document.getElementById("negativeColortextInput").value;
        const font = document.getElementById("fonttextInput").value;

        const phoneNumber = document.getElementById("phoneNumberInput").value;
        const email = document.getElementById("emailInput").value;

        const approvalType =
            approvalSelected === "Empty(For Testing)" ? "" :
            approvalSelected === "No Tag(For Testing)" ? "No Tag" :
            approvalSelected || "Yes";

        const cityTax = document.getElementById("cityTaxInput").value;
        const stateTax = document.getElementById("stateTaxInput").value;
        const reducedStateTax = document.getElementById("reduceTaxInput").value;

        Android.selectedType(
            hostType, tpn, type, amount, tipInput, refId,
            receiptType, paymentType, approvalType, isvID, merchantId,
            primaryColor, secondaryColor, negativeColor, font,
            avs, removeLoader,
            cityTax, stateTax, reducedStateTax,
            phoneNumber, email
        );
    }

    function handleStatusCheck() {
        const type = 'STATUS';

        const paymentType = paymentTypeSelected || 'CREDIT';
        const receiptType = receiptSelected === "Empty(For Testing)" ? "" : receiptSelected || 'No';

        const tpn = document.getElementById("tpnTextInput").value;
        const amount = document.getElementById("amountTextInput").value;
        const tipInput = document.getElementById("tipInput").value;
        const refId = document.getElementById("refIdtextInput").value;

        const isvID = document.getElementById("isvIdTextInput").value;
        const merchantId = document.getElementById("merchantIdTextInput").value;

        const avs = selectedAvsOption || 'YES';
        const removeLoader = selectedLoaderOption || 'YES';

        const primaryColor = document.getElementById("primaryColortextInput").value;
        const secondaryColor = document.getElementById("secondaryColortextInput").value;
        const negativeColor = document.getElementById("negativeColortextInput").value;
        const font = document.getElementById("fonttextInput").value;

        const phoneNumber = document.getElementById("phoneNumberInput").value;
        const email = document.getElementById("emailInput").value;

        const approvalType =
            approvalSelected === "Empty(For Testing)" ? "" :
            approvalSelected === "No Tag(For Testing)" ? "No Tag" :
            approvalSelected || "Yes";

        const cityTax = document.getElementById("cityTaxInput").value;
        const stateTax = document.getElementById("stateTaxInput").value;
        const reducedStateTax = document.getElementById("reduceTaxInput").value;

        Android.selectedType(
            "pay", tpn, type, amount, tipInput, refId,
            receiptType, paymentType, approvalType, isvID, merchantId,
            primaryColor, secondaryColor, negativeColor, font,
            avs, removeLoader,
            cityTax, stateTax, reducedStateTax,
            phoneNumber, email
        );
    }

    function handleRegisterClick() {
        const tpn = document.getElementById("tpnTextInput").value;
        const avs = selectedAvsOption || 'YES';
        const removeLoader = selectedLoaderOption || 'YES';

        const primaryColor = document.getElementById("primaryColortextInput").value;
        const secondaryColor = document.getElementById("secondaryColortextInput").value;
        const negativeColor = document.getElementById("negativeColortextInput").value;
        const font = document.getElementById("fonttextInput").value;

        Android.validateType(
            "register", tpn, "",
            primaryColor, secondaryColor, negativeColor,
            font, avs, removeLoader
        );
    }

    function getTPNClick() {
        Android.validateType("get", "", "getTPN");
    }

    function getDeviceClick() {
        Android.validateType("get", "", "getDevice");
    }

    function handleDropdownChange() {
        const dropdown = document.getElementById("optionDropdown");
        selectedOption = dropdown.options[dropdown.selectedIndex].text;
    }

    function handleAvsChange() {
        const avsdropdown = document.getElementById("optionAvs");
        selectedAvsOption = avsdropdown.options[avsdropdown.selectedIndex].text;
    }

    function handleLoaderChange() {
        const loaderdropdown = document.getElementById("optionLoader");
        selectedLoaderOption = loaderdropdown.options[loaderdropdown.selectedIndex].text;
    }

    function receiptDropdownChange() {
        const dropdown = document.getElementById("optionReceiptType");
        receiptSelected = dropdown.options[dropdown.selectedIndex].text;
    }

    function paymentTypeDropdownChange() {
        const dropdown = document.getElementById("optionPaymentType");
        paymentTypeSelected = dropdown.options[dropdown.selectedIndex].text;

        const optionDropdown = document.getElementById("optionDropdown");
        optionDropdown.innerHTML = "";

        let options = [];

        if (paymentTypeSelected === "GIFT") {
            options = ["ACTIVATE","REDEEM","REFUND","RELOAD","INQUIRE","DEACTIVATE","REISSUE","VOID"];
        } else if (paymentTypeSelected === "LOYALTY") {
            options = ["ACTIVATE","REDEEM","REFUND","RELOAD","INQUIRE","DEACTIVATE","REISSUE","VOID","ADDPOINTS"];
        } else {
            options = [
                "SALE","REFUND","VOID","TIP ADJUST","PRE_AUTH",
                "INC_AUTH","TICKET","SETTLE","BALANCE","ADMINISTRATIVE_TXN"
            ];
        }

        options.forEach(value => {
            const option = document.createElement("option");
            option.value = value;
            option.text = value;
            optionDropdown.appendChild(option);
        });

        selectedOption = options[0];
    }

    function approvalDropdownChange() {
        const dropdown = document.getElementById("ApprovalScreenType");
        approvalSelected = dropdown.options[dropdown.selectedIndex].text;
    }

</script>

</html>
